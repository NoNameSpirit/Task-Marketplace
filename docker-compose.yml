version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: projecttask-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=StrongP@ssw0rd123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
        test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'StrongP@ssw0rd123!' -C -Q 'SELECT 1' || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 20s
        
  web_api:
    build:
        context: .
        dockerfile: wep-api.dockerfile
    ports:
        - "7025:8080"
    depends_on:
        sqlserver:
            condition: service_healthy
    environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - AppConfig__ConnectionString=Server=sqlserver;Database=ProjectTaskDb;User Id=sa;Password=StrongP@ssw0rd123!;TrustServerCertificate=True;
            
            
  blazor_client:
    build:
      context: .
      dockerfile: blazor.dockerfile
    container_name: projecttask-client
    ports:
      - "5020:8080"
    depends_on:
      - web_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__ApiUrl=http://web_api:8080

  blazor_other_client:
    build:
      context: .
      dockerfile: blazor.dockerfile
    container_name: projecttask-other-client
    ports:
      - "5021:8080"
    depends_on:
      - web_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__ApiUrl=http://web_api:8080

volumes:
  sqlserver-data: